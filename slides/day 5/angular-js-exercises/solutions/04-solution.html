<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solution 04 — Calling Spring Boot API with fetch()</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8fafc; color: #1e293b; line-height: 1.6; }
    .container { max-width: 880px; margin: 0 auto; padding: 28px 20px 60px; }
    .nav { display: flex; justify-content: space-between; margin-bottom: 18px; }
    .nav a { color: #0284c7; text-decoration: none; font-weight: 600; }
    .card { background: #fff; border: 1px solid #cbd5e1; border-top: 5px solid #15803d; border-radius: 10px; padding: 20px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    button { background: #0a2540; color: #fff; border: none; padding: 9px 16px; border-radius: 6px; font-size: 0.92rem; font-weight: 600; cursor: pointer; }
    button:hover { background: #0284c7; }
    .status-banner { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-size: 0.9rem; display: none; }
    .status-ok { background: #dcfce7; color: #15803d; }
    .status-err { background: #fee2e2; color: #b91c1c; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #0a2540; color: #fff; text-align: left; padding: 10px 12px; font-size: 0.85rem; }
    td { padding: 10px 12px; border-bottom: 1px solid #e2e8f0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav">
      <a href="../04-calling-spring-boot-api.html">← Back to Exercise 04</a>
      <a href="index.html">All Solutions</a>
    </div>

    <div class="card">
      <div class="toolbar">
        <strong>Live Data from Spring Boot (<code>GET /api/employees</code>)</strong>
        <button id="load-btn">↻ Fetch Live Employees</button>
      </div>

      <div id="status-banner" class="status-banner"></div>

      <table>
        <thead>
          <tr><th>ID</th><th>Matricule</th><th>Name</th><th>Department</th><th>Salary</th></tr>
        </thead>
        <tbody id="api-table-body">
          <tr><td colspan="5" style="text-align:center; color:#64748b;">Click "Fetch Live Employees" to call Spring Boot.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const loadBtn = document.getElementById("load-btn");
    const tbody = document.getElementById("api-table-body");
    const statusBanner = document.getElementById("status-banner");

    function renderRows(employees) {
      tbody.innerHTML = "";
      employees.forEach(function(emp) {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${emp.id}</td>
          <td><code>${emp.matricule}</code></td>
          <td><strong>${emp.firstName} ${emp.lastName}</strong></td>
          <td>${emp.departmentCode}</td>
          <td>${emp.salary} DA</td>
        `;
        tbody.appendChild(row);
      });
    }

    function loadFromSpringBoot() {
      statusBanner.style.display = "none";

      fetch("http://localhost:8080/api/employees")
        .then(function(response) {
          if (!response.ok) {
            throw new Error("HTTP error " + response.status);
          }
          return response.json();
        })
        .then(function(employees) {
          statusBanner.className = "status-banner status-ok";
          statusBanner.textContent = "Loaded " + employees.length + " employees live from Spring Boot!";
          statusBanner.style.display = "block";
          renderRows(employees);
        })
        .catch(function(err) {
          statusBanner.className = "status-banner status-err";
          statusBanner.textContent = "Could not connect to http://localhost:8080/api/employees (" + err.message + "). Check that Spring Boot is running and CORS allows this origin (check F12 Console).";
          statusBanner.style.display = "block";
        });
    }

    loadBtn.addEventListener("click", loadFromSpringBoot);
  </script>
</body>
</html>
