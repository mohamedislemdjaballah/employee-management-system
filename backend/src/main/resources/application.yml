server:
  port: 8080

spring:
  application:
    name: ems-backend

  # =========================================================================
  # Configuration PostgreSQL par défaut
  # Correspond au docker-compose.yml ou à une installation locale PostgreSQL
  # =========================================================================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ems_db}
    username: ${DB_USER:ems_user}
    password: ${DB_PASSWORD:ems_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# Documentation OpenAPI / Swagger UI : http://localhost:8080/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

---
# =========================================================================
# Profil de secours "h2" (Base en mémoire sans installation PostgreSQL)
# Lancement : mvn spring-boot:run -Dspring-boot.run.profiles=h2
# =========================================================================
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:ems_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
